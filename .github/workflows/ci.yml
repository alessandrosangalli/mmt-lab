name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elm 0.19.1
        run: |
          curl -sSL -o elm.gz https://github.com/elm/compiler/releases/download/0.19.1/binary-for-linux-64-bit.gz
          gunzip elm.gz
          chmod +x elm
          sudo mv elm /usr/local/bin/elm

      - name: Test
        run: npx --yes elm-test@0.19.1-revision12

      - name: Build
        run: |
          mkdir -p dist
          elm make src/Main.elm --optimize --output=dist/elm.js
          cp public/index.html dist/index.html

      - name: Format (temporary, to fetch the formatted sources)
        run: npx --yes elm-format@0.8.7 --yes src tests

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted
          path: |
            src
            tests

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
